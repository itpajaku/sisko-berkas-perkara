<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    PassEnv APP_NAME APP_KEY APP_SALT CI_ENV BASE_URL DB_HOST DB_NAME DB_USER DB_PASS DB_HOST_SIPP DB_NAME_SIPP DB_USER_SIPP DB_PASS_SIPP SIPP_URL SIPP_HOST SIPP_APP_KEY LOGO

    ErrorLog /var/www/html/application/logs/error.log
    CustomLog /var/www/html/application/logs/access.log combined

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
