services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sisko-berkas-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:80"
    environment:
      APP_NAME: "${APP_NAME:-Sistem Kontrol Berkas}"
      APP_KEY: "${APP_KEY:-base64:Z9l1f07NBCJrPOTNrKQnT7SxGGR9P3mQSBkzGK29NT4=}"
      APP_SALT: "${APP_SALT:-250224}"
      CI_ENV: "${CI_ENV:-development}"
      BASE_URL: "${BASE_URL:-http://localhost:8085}"
      DB_HOST: db
      DB_NAME: "${DB_NAME:-sikoberdb}"
      DB_USER: "${DB_USER:-root}"
      DB_PASS: "${DB_PASS:-root}"
      DB_HOST_SIPP: "${DB_HOST_SIPP:-192.168.0.222}"
      DB_NAME_SIPP: "${DB_NAME_SIPP:-sipppaju}"
      DB_USER_SIPP: "${DB_USER_SIPP:-imalsipp}"
      DB_PASS_SIPP: "${DB_PASS_SIPP:-kuyabatok}"
      SIPP_URL: "${SIPP_URL:-http://192.168.0.222/SIPP}"
      SIPP_HOST: "${SIPP_HOST:-192.168.0.222}"
      SIPP_APP_KEY: "${SIPP_APP_KEY:-m4hk4m4h4gung}"
      LOGO: "${LOGO:-logos/SISKO-BERKAS.svg}"
      AUTO_MIGRATE: "true"
      AUTO_SEED: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sisko-net

  db:
    image: mariadb:10.11
    container_name: sisko-berkas-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASS:-root}"
      MYSQL_DATABASE: "${DB_NAME:-sikoberdb}"
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sisko-net

networks:
  sisko-net:
    driver: bridge

volumes:
  db_data:
    driver: local
